plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.usbforge'
    compileSdk 34

    defaultConfig {
        applicationId "com.usbforge"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    /**
     * Yalnızca debug varyantında birim testi üretilir.
     *
     * `createComposeRule` çalışma zamanında `ui-test-manifest` içindeki
     * `ComponentActivity` tanımına ihtiyaç duyar; bu bağımlılık
     * `debugImplementation` ile verilir. Release varyantında aynı testler
     * çalıştırılırsa "Compose test etkinliği bulunamadı" hatası verir ve
     * `gradlew test` aynı işi iki kez yapar. Bu yüzden release birim
     * testleri devre dışı bırakılır. Çalıştırılacak görev:
     *
     * ```
     * ./gradlew :app:testDebugUnitTest
     * ```
     */
    androidComponents {
        beforeVariants(selector().withBuildType("release")) { variant ->
            variant.enableUnitTest = false
        }
    }

    // Robolectric'in src/main/res ve kaynakları görmesi için gerekli.
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                maxHeapSize = "2g"
                testLogging {
                    events 'passed', 'skipped', 'failed'
                    exceptionFormat = 'full'
                }
            }
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*']
        }
    }
}

dependencies {
    // Saf JVM mantık modülü: bölüntü tabloları, dosya sistemi biçimlendirme,
    // SCSI kodlaması, Ventoy yerleşimi. Android'e bağımlı değildir ve
    // `./gradlew :core:test` ile cihaz/SDK olmadan test edilir.
    implementation project(':core')

    // --- Jetpack temel ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // --- Compose ---
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // --- Coroutines / Flow ---
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'

    // =============================================================
    //  CİHAZSIZ UI TESTLERİ
    //  `./gradlew :app:testDebugUnitTest`
    //
    //  Robolectric, Activity ve Compose ağacını JVM içinde çalıştırır;
    //  emülatör, cihaz veya SDK emülatörü gerekmez. Bu sayede her UI
    //  değişikliği masaüstünde saniyeler içinde doğrulanır.
    // =============================================================
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'androidx.test.ext:junit-ktx:1.2.1'
    testImplementation platform('androidx.compose:compose-bom:2025.01.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// :core — saf JVM modülü.
//
// Buradaki hiçbir sınıf android.* paketine bağımlı değildir. Bu sayede
// masaüstünde (SDK, cihaz veya emülatör olmadan) `gradle :core:test`
// komutuyla tüm mantık — bölüntü tabloları, FAT32/exFAT/NTFS biçimlendirme,
// SCSI komut kodlaması, Ventoy yerleşimi — saniyeler içinde test edilir.
//
// Android bağımlılığı yalnızca :app modülündedir.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Formatter API'si suspend işlevler sunar; testlerde runBlocking ile
    // çağrılırlar.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Sahte diskler sektör sektör ayrıldığı için bu değer rahat aşılabilir;
    // yine de ISO testleri 8 MiB tampon kullanıyor.
    maxHeapSize = "2g"
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
}

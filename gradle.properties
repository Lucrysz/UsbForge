org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# Robolectric, android-all jar dosyalarını ~/.m2 yerine proje dizininde
# saklar; bu sayede ilk çalıştırmada ek bir indirme yapılır ve sonraki
# testler çevrimdışı da koşar.
robolectric.offline=false
robolectric.logging.enabled=false
